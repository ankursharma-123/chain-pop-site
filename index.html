<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Chain Pop is a colorful chain-link puzzle game for Facebook Instant Games.">
  <title>Chain Pop</title>
  <style>
    :root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#11131c;color:#f4f2ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);padding:clamp(28px,7vw,60px);border:1px solid #34374a;border-radius:24px;background:#1b1e2b;box-shadow:0 24px 70px #0006}
    h1{font-size:clamp(42px,9vw,68px);line-height:1;margin:0;color:#a58aff}p{color:#d1d0df}
    .gem{display:inline-block;width:15px;height:15px;margin:0 5px;border-radius:5px;transform:rotate(45deg);background:#ff6684;box-shadow:20px 0 #56b2ff,40px 0 #ffd166}
    nav{display:flex;flex-wrap:wrap;gap:18px;margin-top:32px}a{color:#b8a5ff}
    footer{margin-top:46px;color:#aaaabd;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div aria-hidden="true"><span class="gem"></span></div>
    <h1>Chain Pop</h1>
    <p>Link matching gems, build big chains, and beat the clock. Play through the campaign, take on the daily challenge, or chase your best score in Endless Sprint.</p>
    <p>Made for Facebook Instant Games.</p>
    <nav aria-label="Information"><a href="privacy.html">Privacy</a><a href="support.html">Support</a></nav>
    <footer>Chain Pop · Ankur Sharma</footer>
  </main>
</body>
</html>
